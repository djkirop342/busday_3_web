<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>송민하의 밤하늘 · 10월 17일</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@300;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#05060f; --gold:#ffd98a; --rose:#ffb7c9; --lilac:#b9a7ff;
  --cream:#fff6e6; --text:rgba(255,248,236,.92); --dim:rgba(255,248,236,.55);
  --serif:'Gowun Batang','Cormorant Garamond',serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}

/* ── 배경 ── */
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 18% 12%, rgba(102,74,190,.32), transparent 65%),
    radial-gradient(50% 40% at 84% 22%, rgba(190,74,140,.22), transparent 65%),
    radial-gradient(70% 55% at 50% 100%, rgba(38,62,150,.35), transparent 70%),
    linear-gradient(180deg,#05060f 0%,#080a1a 45%,#0c0a1c 100%);
  animation:nebulaDrift 34s ease-in-out infinite alternate}
@keyframes nebulaDrift{from{filter:hue-rotate(0) saturate(1);transform:scale(1)}
  to{filter:hue-rotate(-16deg) saturate(1.18);transform:scale(1.06)}}
#stars,#fx{position:fixed;inset:0;display:block;pointer-events:none}
#stars{z-index:1}
#fx{z-index:2}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,.62) 100%)}

/* ── 레이아웃 ── */
.stage{position:relative;z-index:4;height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.scene{display:none;width:min(1100px,100%);max-height:100%;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.scene.active{display:flex;animation:sceneIn 1.1s cubic-bezier(.22,1,.36,1) both}
@keyframes sceneIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.curtain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity 620ms ease;
  background:radial-gradient(circle at 50% 50%, rgba(20,14,40,.92), #05060f 70%)}
.curtain.on{opacity:1}

/* ── 타이포 ── */
.kicker{font-family:var(--serif);letter-spacing:.42em;font-size:clamp(9px,1.4vw,12px);color:var(--dim);text-transform:uppercase;margin:0;padding-left:.42em}
.title-name{font-family:var(--serif);font-weight:700;font-size:clamp(46px,12vw,128px);line-height:1.05;margin:0;letter-spacing:.04em;
  background:linear-gradient(100deg,#fff6e6 0%,var(--gold) 30%,#fff 46%,var(--rose) 68%,#fff6e6 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 26px rgba(255,214,138,.28))}
@keyframes shimmer{from{background-position:0 50%}to{background-position:260% 50%}}
.title-name .ch{display:inline-block;animation:chIn 900ms cubic-bezier(.22,1,.36,1) both}
@keyframes chIn{from{opacity:0;transform:translateY(.5em) rotateX(60deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.date-badge{font-family:var(--serif);font-size:clamp(13px,2vw,17px);letter-spacing:.32em;color:var(--gold);
  padding:8px 20px 8px 24px;border:1px solid rgba(255,217,138,.32);border-radius:999px;background:rgba(255,217,138,.05)}
.lede{font-family:var(--serif);font-size:clamp(11px,3vw,19px);color:var(--dim);margin:0;line-height:1.9;
  max-width:none;white-space:nowrap}
.section-title{font-family:var(--serif);font-size:clamp(24px,5vw,44px);margin:0;letter-spacing:.16em;color:var(--cream);text-shadow:0 0 30px rgba(255,214,138,.35)}
.hint{font-size:clamp(12px,1.7vw,14px);color:var(--dim);letter-spacing:.08em;margin:0;min-height:1.6em}
.hint.warn{color:var(--rose);animation:nudge .42s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ── 버튼 ── */
.btn{font-family:var(--serif);font-size:clamp(13px,1.8vw,16px);letter-spacing:.2em;padding:14px 30px 14px 34px;color:var(--cream);
  background:linear-gradient(180deg,rgba(255,217,138,.16),rgba(255,217,138,.04));border:1px solid rgba(255,217,138,.4);
  border-radius:999px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .24s cubic-bezier(.22,1,.36,1),box-shadow .24s ease,border-color .24s ease;
  animation:fadeUp .9s both}
.btn:hover{transform:translateY(-3px);border-color:rgba(255,217,138,.8);box-shadow:0 12px 40px -12px rgba(255,214,138,.6)}
.btn:active{transform:translateY(0) scale(.98)}
.btn::after{content:'';position:absolute;inset:0;transform:translateX(-120%);transition:transform .9s ease;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%)}
.btn:hover::after{transform:translateX(120%)}
.btn.ghost{background:transparent;border-color:rgba(255,248,236,.22);color:var(--dim);font-size:12px;letter-spacing:.14em;padding:11px 22px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp 1s both}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.4s}
.hidden{display:none !important}

/* ── 별자리 ── */
.sky-frame{width:min(980px,96vw);position:relative;display:flex;justify-content:center}
#cSvg{width:100%;height:auto;max-height:50vh;display:block;overflow:visible}
.c-face{opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.c-face.show{opacity:1}
#cRipples,#cLines{pointer-events:none}
.c-star{cursor:pointer}
.c-star .hit{fill:transparent}
.c-star .core{fill:#fff;opacity:.34;transition:opacity .6s ease,r .6s cubic-bezier(.22,1,.36,1)}
.c-star .halo{opacity:0;transition:opacity .8s ease,r .8s ease}
.c-star.lit .core{opacity:1}
.c-star.lit .halo{opacity:.55}
.c-star.next .core{animation:starPulse 1.6s ease-in-out infinite}
@keyframes starPulse{0%,100%{opacity:.5}50%{opacity:1}}
.c-line{stroke:url(#lineGrad);stroke-width:.34;stroke-linecap:round;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;opacity:0;
  transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1),opacity .4s ease}
.c-line.drawn{stroke-dashoffset:0;opacity:1}
.c-label{font-family:var(--serif);font-size:1.9px;fill:rgba(255,248,236,.6);opacity:0;transition:opacity .8s ease .3s;pointer-events:none}
.c-label.show{opacity:1}
.star-line{font-family:var(--serif);font-size:clamp(15px,2.6vw,24px);color:var(--cream);min-height:2.6em;
  display:flex;align-items:center;justify-content:center;line-height:1.7;letter-spacing:.05em;
  text-shadow:0 0 24px rgba(255,214,138,.3)}
.star-line span{animation:fadeUp .9s both}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,248,236,.2);transition:all .5s ease}
.dots i.on{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.25)}
.done-panel{display:flex;flex-direction:column;align-items:center;gap:12px;animation:fadeUp 1.2s both}
.zodiac-symbol{width:clamp(38px,7vw,60px);color:var(--gold);filter:drop-shadow(0 0 22px rgba(255,214,138,.75));
  animation:symbolIn 1.6s cubic-bezier(.22,1,.36,1) both}
.zodiac-symbol svg{width:100%;height:auto;display:block;fill:currentColor}
@keyframes symbolIn{from{opacity:0;transform:scale(.4) rotate(-40deg);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}

/* ── 케이크 ── */
.cake-wrap{width:min(560px,88vw);position:relative}
#kSvg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.candle-hit{fill:transparent;cursor:pointer}
.flame-g,.flame-flicker{transform-box:fill-box;transform-origin:50% 100%}
.flame-flicker{animation:flicker 1.05s ease-in-out infinite alternate}
@keyframes flicker{0%{transform:scale(1,1) translateX(0);opacity:.94}
  45%{transform:scale(.9,1.12) translateX(-.5px);opacity:1}
  100%{transform:scale(1.09,.92) translateX(.6px);opacity:.86}}
.flame-in{animation:flameIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes flameIn{from{transform:scale(.08);opacity:0}60%{transform:scale(1.35);opacity:1}to{transform:scale(1)}}
.flame-out{animation:flameOut .32s ease-in forwards}
@keyframes flameOut{0%{transform:scale(1);opacity:1}
  40%{transform:scale(1.3,.66);opacity:.9}
  100%{transform:scale(.04,.16);opacity:0}}
.smoke{transform-box:fill-box;transform-origin:50% 100%;animation:smokeUp 2.3s ease-out forwards}
@keyframes smokeUp{0%{opacity:.7;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-30px) scale(2.2)}}
.falling{animation:fallDown .8s cubic-bezier(.45,0,.75,.2) forwards}
@keyframes fallDown{from{opacity:1;transform:translateY(-150px) scale(1.5)}to{opacity:0;transform:translateY(0) scale(.2)}}

/* ── 피날레 ── */
#scene-finale{pointer-events:none}
#scene-finale .btn,#scene-finale .letter{pointer-events:auto}
.letter{width:min(560px,90vw);max-height:56vh;overflow-y:auto;padding:34px 30px;border-radius:6px;
  background:linear-gradient(180deg,rgba(255,246,230,.97),rgba(255,238,214,.94));color:#3a2c1c;
  font-family:var(--serif);font-size:clamp(14px,2.1vw,16px);line-height:2.15;text-align:left;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,217,138,.4);
  animation:letterOpen .9s cubic-bezier(.22,1,.36,1) both;transform-origin:top center}
@keyframes letterOpen{from{opacity:0;transform:scaleY(.02) translateY(-30px);filter:blur(8px)}60%{opacity:1}to{opacity:1;transform:none;filter:none}}
.letter{position:relative;scroll-behavior:smooth}
.letter p{margin:0 0 .2em;min-height:1em;opacity:0;transform:translateY(16px);filter:blur(7px);
  transition:opacity .95s ease,transform .95s cubic-bezier(.22,1,.36,1),filter .95s ease,color .6s ease,text-shadow .6s ease}
.letter p.on{opacity:1;transform:none;filter:none}
.letter p.hi{color:#a2661f;font-weight:700;letter-spacing:.03em}
.letter p.big{font-size:1.32em;line-height:1.9;color:#7a4a12;font-weight:700;text-align:center;margin-top:.5em}
.letter p.flash{color:#c07d1c;text-shadow:0 0 18px rgba(255,182,66,.65)}
.letter .sig{margin-top:24px;text-align:right;color:#8a6a3c;font-size:.92em}
.letter::-webkit-scrollbar{width:5px}
.letter::-webkit-scrollbar-thumb{background:rgba(160,120,60,.35);border-radius:9px}
.note-mark{position:absolute;top:12px;right:16px;font-size:13px;color:rgba(160,110,40,.5);animation:noteBob 2.2s ease-in-out infinite}
@keyframes noteBob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-5px);opacity:.9}}
.downloads{display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:fadeUp 1.1s cubic-bezier(.22,1,.36,1) both}
.dl-title{font-family:var(--serif);font-size:clamp(17px,2.8vw,24px);color:var(--cream);margin:0;
  letter-spacing:.14em;text-shadow:0 0 26px rgba(255,214,138,.4)}
a.btn.dl{text-decoration:none;display:inline-flex;align-items:center;gap:9px;padding:15px 30px 15px 32px}
a.btn.dl::before{content:'↓';font-size:1.05em;opacity:.75}
.big-msg{font-family:var(--serif);font-size:clamp(34px,9vw,86px);margin:0;letter-spacing:.06em;
  background:linear-gradient(100deg,#fff6e6,var(--gold) 35%,#fff 50%,var(--rose) 70%,#fff6e6);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 30px rgba(255,214,138,.35))}

@keyframes spin{to{transform:rotate(360deg)}}
.countdown{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,24px);text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 45%, rgba(14,12,32,.76), rgba(5,6,15,.96));
  transition:opacity 1s ease, transform 1s cubic-bezier(.22,1,.36,1)}
.countdown.off{opacity:0;transform:scale(1.05);pointer-events:none}
.cd-name{font-family:var(--serif);font-weight:700;font-size:clamp(32px,8vw,72px);margin:0;letter-spacing:.06em;
  background:linear-gradient(100deg,#fff6e6,var(--gold) 35%,#fff 50%,var(--rose) 70%,#fff6e6);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 24px rgba(255,214,138,.25))}
.cd-sub{font-family:var(--serif);font-size:clamp(13px,2.2vw,17px);color:var(--dim);margin:0;letter-spacing:.2em}
.cd-clock{display:flex;align-items:flex-start;gap:clamp(4px,1.6vw,16px)}
.cd-unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(46px,13vw,92px)}
.cd-unit b{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,66px);line-height:1;color:var(--cream);
  text-shadow:0 0 30px rgba(255,214,138,.45);font-variant-numeric:tabular-nums}
.cd-unit i{font-style:normal;font-size:clamp(8px,1.4vw,11px);letter-spacing:.28em;color:var(--dim);
  margin-top:clamp(6px,1.2vh,12px);padding-left:.28em}
.cd-sep{font-family:var(--serif);font-size:clamp(22px,6.5vw,48px);line-height:1.1;color:rgba(255,217,138,.4);
  animation:cdBlink 2s ease-in-out infinite}
@keyframes cdBlink{0%,100%{opacity:.2}50%{opacity:.85}}
.cd-date{font-family:var(--serif);letter-spacing:.36em;font-size:clamp(10px,1.8vw,14px);color:var(--gold);margin:0;
  padding:8px 16px 8px 22px;border:1px solid rgba(255,217,138,.3);border-radius:999px;background:rgba(255,217,138,.05)}
.gate{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  cursor:pointer;transition:opacity .9s ease;
  background:radial-gradient(circle at 50% 50%,rgba(12,10,28,.7),rgba(5,6,15,.93));backdrop-filter:blur(2px)}
.gate.off{opacity:0;pointer-events:none}
.g-ring{width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,217,138,.5);display:grid;place-items:center;
  animation:gring 2.4s ease-out infinite}
@keyframes gring{0%{box-shadow:0 0 0 0 rgba(255,217,138,.32)}100%{box-shadow:0 0 0 28px rgba(255,217,138,0)}}
.g-note{width:0;height:0;margin-left:6px;border-left:15px solid var(--gold);
  border-top:10px solid transparent;border-bottom:10px solid transparent}
.gate p{font-family:var(--serif);letter-spacing:.24em;font-size:13px;color:var(--dim);margin:0}
.skip{position:fixed;left:18px;bottom:20px;z-index:50;font-size:11px;letter-spacing:.14em;color:rgba(255,248,236,.28);
  background:none;border:none;cursor:pointer;font-family:var(--sans);transition:color .3s ease}
.skip:hover{color:var(--gold)}
@media (max-width:640px){
  .stage{padding:16px}.scene{gap:14px}
  .letter{padding:26px 22px;line-height:2}
}
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<div class="stage">

  <!-- 1. 인트로 -->
  <section class="scene active" id="scene-intro">
    <p class="kicker fade-up" id="introKicker"></p>
    <h1 class="title-name" id="introName"></h1>
    <div class="date-badge fade-up" id="introDate"></div>
    <p class="lede fade-up" id="introSub"></p>
    <button class="btn" id="introBtn"></button>
  </section>

  <!-- 2. 별자리 -->
  <section class="scene" id="scene-constellation">
    <p class="kicker" id="cKicker"></p>
    <div class="sky-frame">
      <svg id="cSvg" viewBox="0 0 100 70" role="img" aria-label="천칭자리">
        <defs>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,217,138,.18)"/>
            <stop offset="50%" stop-color="rgba(255,240,205,.95)"/>
            <stop offset="100%" stop-color="rgba(185,167,255,.6)"/>
          </linearGradient>
          <radialGradient id="starGlow">
            <stop offset="0%" stop-color="rgba(255,244,214,.95)"/>
            <stop offset="45%" stop-color="rgba(255,214,138,.35)"/>
            <stop offset="100%" stop-color="rgba(255,214,138,0)"/>
          </radialGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation=".5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="cLines" filter="url(#soft)"></g>
        <g id="cRipples"></g>
        <g id="cStars"></g>
        <g id="cFace" class="c-face"></g>
      </svg>
    </div>
    <div class="star-line" id="cMsg"></div>
    <div class="dots" id="cDots"></div>
    <p class="hint" id="cHint"></p>
    <div class="done-panel hidden" id="cDone">
      <div class="zodiac-symbol" id="cSymbol"></div>
      <h2 class="section-title fade-up d1" id="cDoneTitle"></h2>
      <p class="lede fade-up d2" id="cTagline"></p>
      <p class="star-line fade-up d3" style="min-height:0" id="cDoneMsg"></p>
      <button class="btn d4" id="cNext"></button>
    </div>
  </section>

  <!-- 3. 케이크 -->
  <section class="scene" id="scene-cake">
    <div class="cake-wrap">
      <svg id="kSvg" viewBox="0 0 400 330">
        <defs>
          <linearGradient id="gTier1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff3e2"/><stop offset="100%" stop-color="#e9bfa2"/>
          </linearGradient>
          <linearGradient id="gTier2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffeaf0"/><stop offset="100%" stop-color="#f0bccd"/>
          </linearGradient>
          <linearGradient id="gTier3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff6ea"/><stop offset="100%" stop-color="#ecd0ae"/>
          </linearGradient>
          <linearGradient id="gDrip" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffaf1"/><stop offset="100%" stop-color="#ffeccd"/>
          </linearGradient>
          <linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d9c9f2"/><stop offset="100%" stop-color="#6d5c96"/>
          </linearGradient>
          <linearGradient id="gCandle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f3a8bd"/><stop offset="45%" stop-color="#fff1f5"/><stop offset="100%" stop-color="#e4899f"/>
          </linearGradient>
          <radialGradient id="gFlame">
            <stop offset="0%" stop-color="#fffdf0"/><stop offset="45%" stop-color="#ffd469"/><stop offset="100%" stop-color="#ff8a34"/>
          </radialGradient>
          <radialGradient id="gFlameGlow">
            <stop offset="0%" stop-color="rgba(255,196,92,.75)"/><stop offset="100%" stop-color="rgba(255,150,40,0)"/>
          </radialGradient>
          <radialGradient id="gCakeGlow">
            <stop offset="0%" stop-color="rgba(255,206,120,.32)"/><stop offset="100%" stop-color="rgba(255,180,90,0)"/>
          </radialGradient>
        </defs>
        <ellipse id="kGlow" cx="200" cy="170" rx="200" ry="150" fill="url(#gCakeGlow)" opacity="0" style="transition:opacity 1.2s ease"/>
        <g id="kCake"></g>
        <g id="kCandles"></g>
        <g id="kEffects"></g>
      </svg>
    </div>
    <h2 class="section-title hidden" id="kTitle"></h2>
    <p class="hint" id="kHint"></p>
    <div class="row">
      <button class="btn hidden" id="kNext"></button>
    </div>
  </section>

  <!-- 4. 피날레 -->
  <section class="scene" id="scene-finale">
    <p class="kicker fade-up" id="fKicker"></p>
    <h2 class="big-msg" id="fTitle"></h2>
    <p class="lede fade-up d2" id="fSub"></p>
    <div class="letter hidden" id="fLetter"></div>

    <div class="downloads hidden" id="fDownloads">
      <p class="dl-title" id="dlTitle"></p>
      <div class="row">
        <a class="btn dl hidden" id="dlApp" target="_blank" rel="noopener"></a>
        <a class="btn dl hidden" id="dlGame" target="_blank" rel="noopener"></a>
      </div>

const rand = (a, b) => a + Math.random() * (b - a);

/* ══════════════ 효과음 (파일 없이 합성) ══════════════ */
const SFX = (function () {
  let ctx = null, master = null, noise = null, on = true, lastBoom = 0;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = .5;
    master.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  const ready = () => on && ctx && master;

  function env(node, gain, attack, decay, delay = 0) {
    const g = ctx.createGain();
    const t = ctx.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
    node.connect(g); g.connect(master);
    return { g, t, end: t + attack + decay };
  }

  function tone(type, f0, f1, gain, attack, decay, delay = 0) {
    if (!ready()) return;
    const o = ctx.createOscillator();
    o.type = type;
    const e = env(o, gain, attack, decay, delay);
    o.frequency.setValueAtTime(f0, e.t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), e.end);
    o.start(e.t); o.stop(e.end + .05);
  }

  function hiss(gain, decay, type, f0, f1, q, delay = 0) {
    if (!ready()) return;
    const s = ctx.createBufferSource();
    s.buffer = noise; s.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = type; bp.Q.value = q || 1;
    s.connect(bp);
    const e = env(bp, gain, .012, decay, delay);
    bp.frequency.setValueAtTime(f0, e.t);
    if (f1 && f1 !== f0) bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), e.end);
    s.start(e.t); s.stop(e.end + .05);
  }

  const API = {
    init,
    get enabled() { return on; },
    toggle() { on = !on; if (on) init(); return on; },
    volume(v) { if (master) master.gain.value = v; },

    tick() { tone('triangle', 1100, 520, .10, .004, .07); hiss(.03, .05, 'highpass', 3000); },
    soft() { tone('sine', 320, 190, .09, .01, .16); },

    // 별을 하나 켤 때 — 인덱스가 올라갈수록 음이 높아집니다
    chime(i = 0) {
      const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7];
      const f = scale[i % scale.length] * (i >= scale.length ? 2 : 1);
      tone('sine', f, f, .16, .006, 1.5);
      tone('sine', f * 2.01, f * 2.01, .06, .006, 1.1, .01);
      tone('sine', f * 3, f * 3, .025, .006, .7, .02);
      hiss(.02, .3, 'highpass', 5000);
    },

    // 별자리 완성
    shimmer() {
      [0, 2, 4, 5, 6].forEach((n, k) => setTimeout(() => API.chime(n), k * 130));
    },

    // 촛불 켜기
    light() {
      hiss(.09, .34, 'lowpass', 400, 1800, 1);
      tone('sine', 180, 90, .07, .012, .3);
      for (let i = 0; i < 4; i++) hiss(.025, .05, 'bandpass', rand(2200, 5200), null, 8, .12 + i * .06);
    },

    // 촛불 끄기 (후—)
    puff() {
      hiss(.13, .3, 'lowpass', 1500, 260, .8);
      hiss(.05, .16, 'highpass', 900, 300, .7, .02);
    },

    // 폭죽 발사
    whistle() {
      if (!ready()) return;
      const o = ctx.createOscillator();
      o.type = 'sine';
      const e = env(o, .05, .05, .62);
      o.frequency.setValueAtTime(280, e.t);
      o.frequency.exponentialRampToValueAtTime(1500, e.end);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 14; lg.gain.value = 22;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(e.t); lfo.stop(e.end);
      o.start(e.t); o.stop(e.end + .05);
    },

    // 폭죽 터짐
    boom(power = 1) {
      const now = performance.now();
      if (now - lastBoom < 80) return;
      lastBoom = now;
      const p = Math.min(1.4, power);
      hiss(.17 * p, .5 * p, 'lowpass', 2600, 300, .7);
      tone('sine', 90, 38, .16 * p, .006, .34);
      for (let i = 0; i < 9; i++)
        hiss(.02 * p, .045, 'bandpass', rand(2500, 7000), null, 10, .1 + Math.random() * .55);
    },

    // 작은 반짝임
    sparkle() {
      hiss(.05, .12, 'highpass', 4200);
      tone('sine', rand(1400, 2200), rand(2400, 3200), .05, .005, .18);
    },

    // 편지 펼치기 (종이 소리)
    paper() {
      hiss(.09, .26, 'bandpass', 1400, 3400, 1.4);
      hiss(.05, .18, 'bandpass', 800, 2200, 2, .1);
    },

    // 장면 전환
    woosh() { hiss(.07, .55, 'bandpass', 260, 1400, .9); }
  };
  return API;
})();

/* ══════════════ 밤하늘 ══════════════ */
(function starfield() {
  const cv = $('#stars'), ctx = cv.getContext('2d');
  let stars = [], meteors = [], w = 0, h = 0, elapsed = 0, nextMeteor = 1200, last = performance.now();
  window.__boost = 0;

  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(340, (w * h) / 3600));
    stars = Array.from({ length: n }, () => {
      const deep = Math.random();
      return { x: Math.random() * w, y: Math.random() * h,
        r: deep > .94 ? rand(1.3, 2.1) : rand(.35, 1.15),
        base: rand(.25, .85), phase: Math.random() * 6.28, sp: rand(.4, 1.7),
        drift: rand(.004, .02), big: deep > .94, tint: Math.random() };
    });
  }

  function frame(now) {
    const dt = Math.min(48, now - last); last = now; elapsed += dt;
    const b = window.__boost;
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.phase += dt / 1000 * s.sp * (1 + b * .5);
      s.y += s.drift * dt / 16; if (s.y > h + 4) s.y = -4;
      const tw = .5 + .5 * Math.sin(s.phase);
      const a = Math.min(1, s.base * (.45 + tw * .75) * (1 + b * .35));
      if (s.big) {
        ctx.save();
        ctx.shadowBlur = 10 + tw * 10;
        ctx.shadowColor = s.tint > .7 ? 'rgba(255,214,138,.9)' : 'rgba(200,215,255,.9)';
        ctx.fillStyle = 'rgba(255,250,240,' + a + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = s.tint > .75 ? 'rgba(255,226,178,' + a + ')'
          : s.tint < .2 ? 'rgba(196,210,255,' + a + ')' : 'rgba(255,252,246,' + a + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
      }
    }
    if (elapsed > nextMeteor) {
      const left = Math.random() > .35;
      meteors.push({ x: left ? rand(-100, w * .55) : rand(w * .5, w + 100), y: rand(-60, h * .42),
        vx: (left ? 1 : -1) * rand(4.6, 8.2), vy: rand(2.2, 4.4), len: rand(90, 230), life: 1 });
      nextMeteor = elapsed + rand(2600, 8200) / (1 + b);
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt / 16; m.y += m.vy * dt / 16; m.life -= .006 * dt / 16;
      if (m.life <= 0 || m.y > h + 140 || m.x < -280 || m.x > w + 280) { meteors.splice(i, 1); continue; }
      const d = Math.hypot(m.vx, m.vy), tx = m.x - m.vx / d * m.len, ty = m.y - m.vy / d * m.len;
      const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,248,230,' + .85 * m.life + ')');
      g.addColorStop(.4, 'rgba(255,214,158,' + .28 * m.life + ')');
      g.addColorStop(1, 'rgba(255,214,158,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  build(); addEventListener('resize', build); requestAnimationFrame(frame);
})();

/* ══════════════ 폭죽 / 파티클 ══════════════ */
const FX = (function () {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let parts = [], w = 0, h = 0, running = false, last = performance.now();
  const HUES = [42, 12, 330, 268, 200, 55];

  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); addEventListener('resize', size);

  function burst(x, y, power = 1, hue) {
    if (power < .6) SFX.sparkle(); else SFX.boom(power);
    const H = hue == null ? HUES[(Math.random() * HUES.length) | 0] : hue;
    const n = Math.round(rand(46, 78) * power);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, sp = rand(.8, 7.2) * power;
      parts.push({ t: 'p', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: rand(.008, .019), hue: H + rand(-18, 18),
        r: rand(1, 2.6), grav: .045 });
    }
    for (let i = 0; i < 14 * power; i++) {
      const a = Math.random() * 6.2832, sp = rand(.4, 2.4);
      parts.push({ t: 'c', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 1, decay: rand(.004, .009), hue: HUES[(Math.random() * HUES.length) | 0],
        w: rand(4, 9), h: rand(6, 13), rot: Math.random() * 6.28, vr: rand(-.2, .2),
        sway: rand(.02, .06), grav: .028 });
    }
    ensure();
  }

  function rocket(x, y) {
    SFX.whistle();
    parts.push({ t: 'r', x, y: h + 10, tx: x, ty: y, vx: rand(-.5, .5), vy: -rand(9, 13), life: 1, decay: 0,
      hue: HUES[(Math.random() * HUES.length) | 0], grav: .16 });
    ensure();
  }

  function ensure() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

  function frame(now) {
    const dt = Math.min(40, now - last) / 16.67; last = now;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.vy += p.grav * dt; p.y += p.vy * dt;

      if (p.t === 'r') {
        ctx.fillStyle = 'hsla(' + p.hue + ',100%,78%,.95)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.2832); ctx.fill();
        if (p.vy >= -1 || p.y <= p.ty) { burst(p.x, p.y, rand(.85, 1.25), p.hue); parts.splice(i, 1); }
        continue;
      }
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > h + 60) { parts.splice(i, 1); continue; }

      if (p.t === 'c') {
        p.rot += p.vr * dt; p.vx += Math.sin(now / 400 + p.x) * p.sway * dt * .1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'hsla(' + p.hue + ',85%,70%,' + p.life + ')';
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      } else {
        p.vx *= .985; p.vy *= .985;
        ctx.fillStyle = 'hsla(' + p.hue + ',100%,' + (58 + 32 * p.life) + '%,' + p.life + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    if (parts.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, w, h); }
  }

  function sparkle(clientX, clientY) { burst(clientX, clientY, .45); }
  return { burst, rocket, sparkle, get h() { return h }, get w() { return w } };
})();

    '<path d="M37 26c11 0 20 8.5 20 17.5C57 52 50 57 42 57c-2.5 0-4-.8-5-.8s-2.5.8-5 .8c-8 0-15-5-15-13.5C17 34.5 26 26 37 26z"/>' +

  // 두 별을 잇는 선. curve 값이 있으면 부드럽게 휘어집니다.
  function curvePath(a, b, curve) {
    if (!curve) return 'M ' + a.x + ' ' + a.y + ' L ' + b.x + ' ' + b.y;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const cx = (a.x + b.x) / 2 + (dy / len) * curve * 2;
    const cy = (a.y + b.y) / 2 + (-dx / len) * curve * 2;
    return 'M ' + a.x + ' ' + a.y + ' Q ' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ' ' + b.x + ' ' + b.y;
  }

  CONFIG.lines.forEach(([a, b, curve]) => {

    gStars.appendChild(g); C.starEls.push(g);

    const dx = s.dx == null ? (s.x > 76 ? -2.6 : 2.6) : s.dx;
    const dy = s.dy == null ? 3.4 : s.dy;
    const anchor = s.anchor || (s.x > 76 ? 'end' : 'start');
    const t = el('text', { class: 'c-label', x: s.x + dx, y: s.y + dy, 'text-anchor': anchor });
    t.textContent = s.ko;

  paintStars();
})();

function paintStars() {
  C.starEls.forEach((g, i) => {
    g.classList.toggle('lit', i < C.lit);
    g.classList.toggle('next', i === C.lit);
    g.querySelector('.ring').style.display = i === C.lit ? '' : 'none';
    g.querySelector('.core').setAttribute('r', (i < C.lit ? CONFIG.stars[i].mag * .9 : CONFIG.stars[i].mag * .55));
  });
  C.labelEls.forEach((t, i) => t.classList.toggle('show', i < C.lit));
  C.dotEls.forEach((d, i) => d.classList.toggle('on', i < C.lit));
  CONFIG.lines.forEach(([a, b], i) => C.lineEls[i].classList.toggle('drawn', C.lit > a && C.lit > b));
}

function lightStar(i) {
  if (C.lit >= CONFIG.stars.length) return;
  const hint = $('#cHint');
  if (i !== C.lit) {
    SFX.soft();
    hint.textContent = CONFIG.constellation.wrong;
    hint.classList.add('warn');
    setTimeout(() => { hint.classList.remove('warn'); hint.textContent = CONFIG.constellation.hint; }, 900);
    return;
  }
  const s = CONFIG.stars[i];
  SFX.chime(i);
  const rip = el('circle', { cx: s.x, cy: s.y, r: 1, fill: 'none',
    stroke: 'rgba(255,236,196,.9)', 'stroke-width': .3 });
  rip.appendChild(el('animate', { attributeName: 'r', values: '1;7', dur: '1.2s', fill: 'freeze' }));
  rip.appendChild(el('animate', { attributeName: 'opacity', values: '.9;0', dur: '1.2s', fill: 'freeze' }));
  $('#cRipples').appendChild(rip);
  setTimeout(() => rip.remove(), 1300);

  C.lit = i + 1;
  paintStars();

  const box = $('#cSvg').getBoundingClientRect();
  FX.sparkle(box.left + box.width * s.x / 100, box.top + box.height * s.y / 70);

  const msg = $('#cMsg');
  const done = C.lit >= CONFIG.stars.length;
  msg.innerHTML = '';
  const sp = document.createElement('span');
  sp.textContent = done ? s.msg + ' ' + CONFIG.name + '.' : s.msg;
  msg.appendChild(sp);

  if (done) {
    hint.textContent = '';
    window.__boost = 1;
    setTimeout(() => $('#cFace').classList.add('show'), 900);
    setTimeout(() => {
      SFX.shimmer();
      $('#cMsg').classList.add('hidden');
      $('#cDots').classList.add('hidden');
      $('#cHint').classList.add('hidden');
      $('#cDone').classList.remove('hidden');
      const b = $('#cSvg').getBoundingClientRect();
      FX.burst(b.left + b.width * .5, b.top + b.height * .45, 1.1, 45);
    }, 2200);
  }
}

/* ══════════════ 3. 케이크 ══════════════ */
const K = { built: false, lit: [], phase: 'light', flames: [], hits: [] };

function dripPath(x, y, w, n, depth, top) {
  let d = 'M ' + x + ' ' + y;
  const seg = w / n;
  for (let i = 0; i < n; i++) {
    const cx = x + seg * i + seg / 2;
    d += ' Q ' + cx.toFixed(1) + ' ' + (y + depth) + ', ' + (x + seg * (i + 1)).toFixed(1) + ' ' + y;
  }
  d += ' L ' + (x + w) + ' ' + (y - top) + ' L ' + x + ' ' + (y - top) + ' Z';
  return d;
}

function buildCake() {
  const cake = $('#kCake'), cand = $('#kCandles');
  cake.innerHTML = ''; cand.innerHTML = ''; $('#kEffects').innerHTML = '';
  $('#kGlow').setAttribute('opacity', 0);

  // 스프링클
  const cols = ['#ffd98a', '#ffb7c9', '#b9a7ff', '#fff6e6', '#9fd4ff'];
  for (let i = 0; i < 46; i++) {

    else { x = rand(134, 266); y = rand(112, 134); }

  }

  // 명패
  const plaque = el('text', { x: 200, y: 244, 'text-anchor': 'middle',

  plaque.textContent = CONFIG.cake.plaque;
  cake.appendChild(plaque);

  // 초
  K.lit = new Array(CONFIG.cake.count).fill(false);
  K.flames = []; K.hits = [];
  const left = 130, span = 140, n = CONFIG.cake.count;

    for (let s = 0; s < 3; s++)
      g.appendChild(el('rect', { x: x - 4, y: 50 + s * 13, width: 8, height: 3.4,

      'stroke-width': 1.6, fill: 'none', 'stroke-linecap': 'round' }));

    const flame = el('g', { class: 'flame-g', style: 'display:none' });
    flame.appendChild(el('circle', { cx: x, cy: 26, r: 20, fill: 'url(#gFlameGlow)' }));
    const flick = el('g', { class: 'flame-flicker' });

      fill: 'url(#gFlame)'

      fill: 'rgba(255,253,235,.95)'

    cand.appendChild(g);
    K.flames.push({ el: flame, x: x });
  }
  K.built = true;
}

function initCake() {
  if (!K.built) buildCake();
  $('#kHint').textContent = CONFIG.cake.lightHint;
  $('#kTitle').classList.add('hidden');
  $('#kNext').classList.add('hidden');
  $('#kNext').textContent = CONFIG.cake.cta;
  K.phase = 'light';
}

function onCandle(i) {
  if (K.phase === 'light') {
    if (K.lit[i]) return;
    dropStar(i);
  } else if (K.phase === 'wish') {
    if (!K.lit[i]) return;
    blowOut(i);
  }
}

function dropStar(i) {
  const f = K.flames[i];
  const g = el('g', { class: 'falling' });
  g.appendChild(el('circle', { cx: f.x, cy: 34, r: 3.4, fill: '#fff6e0' }));
  g.appendChild(el('circle', { cx: f.x, cy: 34, r: 11, fill: 'url(#gFlameGlow)' }));
  $('#kEffects').appendChild(g);
  setTimeout(() => g.remove(), 850);

  setTimeout(() => {
    K.lit[i] = true;
    SFX.light();
    f.el.classList.remove('flame-out');
    f.el.style.display = '';
    f.el.classList.add('flame-in');
    setTimeout(() => f.el.classList.remove('flame-in'), 760);
    updateGlow();
    if (K.lit.every(Boolean)) toWish();
  }, 700);
}

function updateGlow() {
  const n = K.lit.filter(Boolean).length;
  $('#kGlow').setAttribute('opacity', Math.min(1, n / CONFIG.cake.count));
}

function toWish() {
  K.phase = 'wish';
  setTimeout(() => {
    $('#kTitle').textContent = CONFIG.cake.wishTitle;
    $('#kTitle').classList.remove('hidden');
    $('#kHint').textContent = CONFIG.cake.wishHint;
  }, 900);
}

function blowOut(i) {
  if (!K.lit[i]) return;
  K.lit[i] = false;
  SFX.puff();
  const f = K.flames[i];
  f.el.classList.remove('flame-in');
  f.el.classList.add('flame-out');
  setTimeout(() => {
    if (!K.lit[i]) { f.el.style.display = 'none'; f.el.classList.remove('flame-out'); }
  }, 340);

  const smoke = el('g', { class: 'smoke' });
  for (let s = 0; s < 3; s++)
    smoke.appendChild(el('circle', { cx: f.x + rand(-3, 3), cy: 34 - s * 6, r: rand(2.5, 4.5),
      fill: 'rgba(226,226,240,.5)' }));
  $('#kEffects').appendChild(smoke);
  setTimeout(() => smoke.remove(), 2400);
  updateGlow();

  if (!K.lit.some(Boolean)) allBlownOut();
}

function allBlownOut() {
  K.phase = 'done';
  setTimeout(() => {
    $('#kTitle').textContent = CONFIG.cake.doneMsg;
    $('#kHint').textContent = '';
    $('#kNext').classList.remove('hidden');
  }, 900);
}

/* ══════════════ 4. 피날레 ══════════════ */
let finaleTimer = 0, finaleReady = false, letterTimer = 0, subTimer = 0;
(function finaleSetup() {
  $('#fKicker').textContent = CONFIG.finale.kicker;
  $('#fTitle').textContent = CONFIG.finale.title;
  $('#fSub').textContent = CONFIG.finale.sub;
  $('#fLetterBtn').textContent = CONFIG.finale.letterBtn;
  $('#fRestart').textContent = CONFIG.finale.restart;

  const L = $('#fLetter');
  const mark = document.createElement('div');
  mark.className = 'note-mark'; mark.textContent = '♪';
  L.appendChild(mark);

  CONFIG.finale.letter.forEach(raw => {
    const p = document.createElement('p');
    if (raw.startsWith('**')) { p.className = 'big'; p.dataset.hi = '2'; p.textContent = raw.slice(2); }
    else if (raw.startsWith('*')) { p.className = 'hi'; p.dataset.hi = '1'; p.textContent = raw.slice(1); }
    else p.textContent = raw;
    L.appendChild(p);
  });
  const sig = document.createElement('p');
  sig.className = 'sig'; sig.textContent = CONFIG.finale.signature;
  L.appendChild(sig);

  const lines = Array.from(L.querySelectorAll('p'));
  const audio = $('#bgm');
  $('#fRevealAll').textContent = CONFIG.finale.revealAll;

  function showLine(p) {
    p.classList.add('on');
    if (!p.textContent.trim()) return;
    p.classList.add('flash');
    setTimeout(() => p.classList.remove('flash'), 1300);
    L.scrollTo({ top: Math.max(0, p.offsetTop - L.clientHeight * .5), behavior: 'smooth' });
    if (p.dataset.hi === '2')
      FX.burst(rand(innerWidth * .3, innerWidth * .7), rand(innerHeight * .18, innerHeight * .38), 1.2);
  }

  function step(i) {
    if (i >= lines.length) {
      $('#fRevealAll').classList.add('hidden');
      letterTimer = setTimeout(finishLetter, 2800);
      return;
    }
    const p = lines[i];
    showLine(p);
    const pace = CONFIG.finale.letterPace;
    const delay = !p.textContent.trim() ? pace * .35 : p.dataset.hi === '2' ? pace * 1.3 : pace;
    letterTimer = setTimeout(() => step(i + 1), delay);
  }

  function resetLetter() {
    clearTimeout(letterTimer); letterTimer = 0;
    lines.forEach(p => p.classList.remove('on', 'flash'));
    L.scrollTop = 0;
  }

  function revealAll() {
    clearTimeout(letterTimer);
    lines.forEach(p => p.classList.add('on'));
    $('#fRevealAll').classList.add('hidden');
    letterTimer = setTimeout(finishLetter, 3200);
  }

  /* 편지를 접고 선물 버튼을 보여줍니다 */
  function finishLetter() {
    letterTimer = 0;
    closeLetter();
    setTimeout(() => {
      const box = $('#fDownloads');
      if (!box.classList.contains('hidden')) return;
      box.classList.remove('hidden');
      SFX.chime(5);
      FX.burst(innerWidth * .5, innerHeight * .45, 1.2);
      setTimeout(() => FX.rocket(innerWidth * .28, innerHeight * .26), 400);
      setTimeout(() => FX.rocket(innerWidth * .72, innerHeight * .3), 850);
    }, 750);
  }

  function openLetter() {
    resetLetter();
    L.classList.remove('hidden');
    $('#fLetterBtn').textContent = CONFIG.finale.letterClose;
    $('#fRevealAll').classList.remove('hidden');
    SFX.paper();
    FX.burst(innerWidth / 2, innerHeight * .34, .9);
    audio.volume = CONFIG.musicVolume;
    if (audio.paused) audio.play().catch(() => {});
    letterTimer = setTimeout(() => step(0), 900);
  }

  function closeLetter() {
    resetLetter();
    L.classList.add('hidden');
    $('#fLetterBtn').textContent = CONFIG.finale.letterBtn;
    $('#fRevealAll').classList.add('hidden');
  }

  /* 아이폰·아이패드면 앱 버튼만, PC면 앱 + 게임 버튼 */
  (function setupDownloads() {
    const D = CONFIG.finale.downloads;
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobile = isIOS || /Android/i.test(ua);

    $('#dlTitle').textContent = D.title;
    $('#dlNote').textContent = D.note;

    const wire = (id, item, show) => {
      const a = $(id);
      if (!show) return;
      a.textContent = item.label;
      a.classList.remove('hidden');
      if (item.url) {
        a.href = item.url;
        if (/^itms-services:/i.test(item.url)) a.removeAttribute('target');
      }
      else a.addEventListener('click', ev => {
        ev.preventDefault();
        $('#dlNote').textContent = D.empty;
      });
    };
    wire('#dlApp', D.app, true);
    wire('#dlGame', D.game, !isMobile);
  })();

  $('#fRevealAll').addEventListener('click', revealAll);
  $('#fLetterBtn').addEventListener('click', () => {
    if (L.classList.contains('hidden')) openLetter(); else closeLetter();
  });

  $('#fRestart').addEventListener('click', () => {
    C.lit = 0; paintStars();
    $('#cMsg').innerHTML = '';
    $('#cFace').classList.remove('show');
    $('#cDone').classList.add('hidden');
    $('#cMsg').classList.remove('hidden');
    $('#cDots').classList.remove('hidden');
    $('#cHint').classList.remove('hidden');
    $('#cHint').textContent = CONFIG.constellation.hint;
    K.built = false;
    window.__boost = 0;
    finaleReady = false;
    clearInterval(finaleTimer);
    $('#fDownloads').classList.add('hidden');
    closeLetter();
    go('intro');
  });
})();

function startFinale() {
  window.__boost = 1.4;
  finaleReady = true;
  const w = innerWidth, h = innerHeight;
  FX.rocket(w * .3, h * .3); FX.rocket(w * .7, h * .34);
  setTimeout(() => FX.rocket(w * .5, h * .2), 700);
  clearInterval(finaleTimer);
  finaleTimer = setInterval(() => {
    if (currentScene !== 'finale') return;
    FX.rocket(rand(innerWidth * .15, innerWidth * .85), rand(innerHeight * .16, innerHeight * .45));
  }, 1900);
}

addEventListener('pointerdown', e => {
  if (currentScene !== 'finale' || !finaleReady) return;
  if (e.target.closest('button, .letter, input')) return;
  FX.burst(e.clientX, e.clientY, rand(.75, 1.15));
});

/* ══════════════ 음악 ══════════════ */
(function music() {
  const a = $('#bgm'), gate = $('#gate');
  let gateGone = false;
  a.volume = CONFIG.musicVolume;

  function hideGate() {
    if (gateGone) return;
    gateGone = true;
    gate.classList.add('off');
    setTimeout(() => { gate.style.display = 'none'; }, 950);
  }
  a.addEventListener('error', hideGate);

  // 게이트는 마우스 클릭으로만 열립니다. 이때 노래가 시작됩니다.
  gate.addEventListener('click', () => {
    SFX.init();
    SFX.tick();
    a.volume = CONFIG.musicVolume;
    a.play().catch(() => {});
    hideGate();
  });
})();

/* 버튼 클릭음 (첫 클릭에서 오디오 엔진도 깨웁니다) */
document.addEventListener('click', e => {
  SFX.init();
  const b = e.target.closest('button');
  if (b && !b.closest('#gate')) SFX.tick();
}, true);

/* ══════════════ 10월 17일 카운트다운 ══════════════ */
(function countdown() {
  const U = CONFIG.unlock;
  const box = $('#count');
  const target = new Date(U.year, U.month - 1, U.day, U.hour || 0, 0, 0, 0).getTime();
  const skip = /[?&](skip|preview)\b/.test(location.search);

  $('#cdName').textContent = CONFIG.name;
  $('#cdSub').textContent = U.title;
  $('#cdDate').textContent = U.dateLabel;

  let gone = false;
  function open(instant) {
    if (gone) return;
    gone = true;
    if (instant) { box.style.display = 'none'; return; }
    box.classList.add('off');
    setTimeout(() => { box.style.display = 'none'; }, 1050);
  }

  if (skip || Date.now() >= target) { open(true); return; }

  const pad = n => (n < 10 ? '0' : '') + n;
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      $('#cdD').textContent = $('#cdH').textContent = $('#cdM').textContent = $('#cdS').textContent = '00';
      $('#cdSub').textContent = U.done;
      setTimeout(() => open(false), 1200);
      return;
    }
    const sec = Math.floor(diff / 1000);
    $('#cdD').textContent = pad(Math.floor(sec / 86400));
    $('#cdH').textContent = pad(Math.floor(sec / 3600) % 24);
    $('#cdM').textContent = pad(Math.floor(sec / 60) % 60);
    $('#cdS').textContent = pad(sec % 60);
    setTimeout(tick, 250);
  }
  tick();
})();

/* ══════════════ 건너뛰기 ══════════════ */
$('#skipBtn').addEventListener('click', () => {
  const order = ['intro', 'constellation', 'cake', 'finale'];
  const i = order.indexOf(currentScene);
  go(order[Math.min(i + 1, order.length - 1)]);
});
</script>
